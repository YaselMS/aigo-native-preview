name: Publish verified iPhone preview 7

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Reviewed successful build run ID
        required: true
      build_commit:
        description: Exact source commit from the reviewed manifest
        required: true
      sha256:
        description: Independently verified IPA SHA-256
        required: true
      release_tag:
        description: Unique Preview 7 release tag for this reviewed build
        required: true

permissions: {}
concurrency:
  group: publish-preview-7
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run }}
      BUILD_COMMIT: ${{ inputs.build_commit }}
      IPA_SHA256: ${{ inputs.sha256 }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate reviewed identifiers
        shell: python
        run: |
          import os, re
          assert re.fullmatch(r'[0-9]+', os.environ['BUILD_RUN'])
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['BUILD_COMMIT'])
          assert re.fullmatch(r'[0-9a-f]{64}', os.environ['IPA_SHA256'])
          assert re.fullmatch(r'v0\.1\.0-preview\.7-run[0-9]+', os.environ['RELEASE_TAG'])
      - name: Download the reviewed build
        run: |
          gh run view "$BUILD_RUN" --json conclusion,headSha > run.json
          gh run download "$BUILD_RUN" --name aigo-preview-7-unsigned-iphone --dir artifact
      - name: Verify artifact and source identity
        shell: python
        run: |
          import hashlib, json, os, pathlib
          run = json.loads(pathlib.Path('run.json').read_text())
          assert run['conclusion'] == 'success'
          assert run['headSha'] == os.environ['BUILD_COMMIT']
          root = pathlib.Path('artifact')
          manifest = json.loads((root / 'build-manifest.json').read_text())
          assert manifest['buildKitCommit'] == os.environ['BUILD_COMMIT']
          assert manifest['app'] == 'AiGo'
          assert manifest['previewLabel'] == 'AiGo Preview 7'
          assert manifest['displayName'] == 'AiGo'
          assert manifest['bundleIdentifier'] == 'dev.aigo.preview'
          assert manifest['preview'] == 7
          assert manifest['upstreamCommit'] == '9400a49af670fdb5db4af58e73f8df98588dbea9'
          assert manifest['version'] == '0.7.8' and manifest['buildNumber'] == '7008999'
          assert manifest['signed'] is False and manifest['remotePushEnabled'] is False
          assert manifest['notificationDiagnostics'] is True
          assert manifest['requestedApnsEnvironment'] == 'production'
          assert manifest['sha256'] == os.environ['IPA_SHA256']
          assert hashlib.sha256((root / 'AiGo-Preview-unsigned.ipa').read_bytes()).hexdigest() == os.environ['IPA_SHA256']
      - name: Publish the unsigned preview download
        run: |
          gh release create "$RELEASE_TAG" artifact/AiGo-Preview-unsigned.ipa artifact/build-manifest.json --target "$GITHUB_SHA" --title 'AiGo Preview 7 - host terminal, terminal controls and AiGo branding' --notes-file RELEASE-NOTES-7.md --prerelease
